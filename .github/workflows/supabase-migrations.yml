name: Supabase Migrations & CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  lint-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verificar integridade dos scripts SQL (Lint)
        run: |
          supabase db lint --level error || true

      - name: Aplicar Migrations no Supabase de Produção
        if: github.ref == 'refs/heads/main' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Conectando ao projeto Supabase $SUPABASE_PROJECT_ID..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          echo "Aplicando migrations pendentes com 'supabase db push'..."
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          echo "Migrations aplicadas com sucesso!"
